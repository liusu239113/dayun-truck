<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#00b578">
<title>大运卡车模拟：从一清二白到世界首富</title>
<link rel="stylesheet" href="DebugLogger/DebugLogger.css">
<style>
/* 调试悬浮球隐藏开关（DebugLogger 绿色圆钮）：要恢复调试入口，删掉本行即可 */
#debug-logger-container{display:none}
:root{--gr:#00b578;--gr2:#009f6a;--or:#ff7a1f;--pr:#ff5000;--bg:#eef1f5;--cd:#fff;--tx:#222;--sub:#8a929c;--line:#e8ecf0;--red:#e64340;--blue:#4a90d9}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;background:#23282e;color:var(--tx);overflow:hidden}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
#stage{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:431px){#stage{margin-top:14px;height:calc(100dvh - 28px);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.55)}}
.hide{display:none!important}
.muted{color:var(--sub);font-size:11px}
.price{color:var(--pr);font-weight:700}
.row{display:flex;align-items:center}
.grow{flex:1}

/* ===== 顶部栏 ===== */
#tbar{background:linear-gradient(160deg,#0fae74,#068a5b);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;flex:none}
.trow1{display:flex;align-items:center;gap:9px}
.tava{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--gr);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.7)}
.tinfo{flex:1;min-width:0}
.tname{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.lvtag{background:#ffe9c8;color:#9a6b1f;font-size:10px;padding:1px 5px;border-radius:6px;font-weight:700}
.tsub{font-size:11px;opacity:.85;margin-top:2px}
.tbtns{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.gearbtn{font-size:17px;opacity:.9;padding:2px 4px}
.chip{font-size:10px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);padding:2px 8px;border-radius:20px;white-space:nowrap}
.trow2{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px}
.wxchip{background:rgba(255,255,255,.16);padding:3px 8px;border-radius:8px}
.tbal{margin-left:auto;font-size:15px;font-weight:800}
.tbal small{font-weight:400;font-size:10px;opacity:.8;margin-right:3px}
.trow3{display:flex;gap:10px;margin-top:9px;align-items:center}
.sb{flex:1;min-width:0}
.sb .sb-t{display:flex;justify-content:space-between;font-size:10px;opacity:.9;margin-bottom:3px}
.sb .sb-t b{font-weight:600}
.sb .track{height:5px;background:rgba(0,0,0,.22);border-radius:4px;overflow:hidden}
.sb .fill{height:100%;border-radius:4px;background:#aef3d3;transition:width .4s}
.sb.warn .fill{background:#ffd77e}
.sb.bad .fill{background:#ff9f92}
.restbtn{flex:none;background:#fff;color:var(--gr);font-weight:700;font-size:12px;padding:7px 13px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.15)}

/* ===== 主视图 ===== */
#views{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:12px 12px 20px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.newstick{background:#fff;border-radius:12px;padding:8px 12px;font-size:11px;color:#6b7280;display:flex;gap:8px;align-items:center;margin-bottom:10px;box-shadow:0 1px 4px rgba(31,41,55,.05)}
.newstick .ns{color:var(--or);font-weight:700;flex:none}

/* 订单卡片 */
.ocard{background:#fff;border-radius:14px;padding:13px 13px 11px;margin-bottom:10px;box-shadow:0 1px 5px rgba(31,41,55,.06)}
.ohead{display:flex;gap:9px}
.oava{width:38px;height:38px;border-radius:50%;color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.owho{flex:1;min-width:0}
.oname{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ostar{color:#ff9d00;font-size:11px;font-weight:600}
.otag{font-size:9px;padding:1px 5px;border-radius:5px;background:#e8f7f0;color:var(--gr);font-weight:700}
.otag.hot{background:#ffece2;color:var(--or)}
.otag.sub{background:#fff3d6;color:#b07a12}
.hallrow{border:1px solid #e8eaee;border-radius:10px;padding:9px 10px;margin-bottom:8px}
.invrow{display:flex;align-items:center;gap:8px;border:1px solid #e8eaee;border-radius:10px;padding:9px 10px;margin-bottom:8px;background:#fff}
.invmain{flex:1;min-width:0}
.invmain b{font-size:13px}
.invmain span{display:block;font-size:11px;color:#667}
.invpos{font-size:10.5px;color:#8a929c;text-align:right;max-width:42%}
.invbtns{display:flex;gap:6px}
.invbtns .btn{padding:6px 12px;font-size:12px}
.scratch-wrap{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;background:linear-gradient(150deg,#123f31,#0c2c22);text-align:center;color:#fff}
.scratch-wrap .prize{font-size:20px;font-weight:800;padding:24px 0}
#scratchCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.otag.good{background:#e7f0ff;color:#1a73e8}
.otag.gold{background:#fdf3d1;color:#c08a00}
.ocard.lux{border:1.5px solid #f2b53c;box-shadow:0 1px 8px rgba(242,181,60,.35)}
.ocard.retur{border:1.5px dashed #7ec2a5}
.osub{font-size:11px;color:var(--sub);margin-top:3px}
.oprice{text-align:right;flex:none}
.oprice b{font-size:18px;color:var(--pr)}
.oprice span{display:block;font-size:9px;color:var(--sub);margin-top:1px}
.oprice em{display:block;font-style:normal;font-size:9px;color:#b07a12;margin-top:1px}
.oroute{margin:10px 2px 0;border-left:0;position:relative;padding-left:16px}
.oroute::before{content:'';position:absolute;left:4.5px;top:10px;bottom:10px;width:0;border-left:1.5px dashed #d6dce2}
.oline{position:relative;padding:5px 0;font-size:13px;font-weight:600}
.oline .nd{position:absolute;left:-16px;top:9px;width:9px;height:9px;border-radius:50%}
.oline .nd.o{background:var(--or)}
.oline .nd.g{background:var(--gr);border-radius:2px}
.oline small{display:block;font-size:10px;color:var(--sub);font-weight:400;margin-top:1px}
.oline small b{color:#e64340;font-weight:600}
.onote{font-size:11px;color:#6b7280;background:#f6f8fa;border-radius:8px;padding:7px 9px;margin-top:8px}
.obtns{display:flex;gap:9px;margin-top:10px}
.btn{flex:1;padding:10px 0;border-radius:22px;font-size:13px;font-weight:700;text-align:center;transition:opacity .15s}
.btn.pri{background:var(--gr);color:#fff;box-shadow:0 3px 8px rgba(0,181,120,.3)}
.btn.pri:active{opacity:.85}
.btn.ghost{background:#f1f4f6;color:#444}
.btn.or{background:var(--or);color:#fff}
.btn.rd{background:#fff;color:var(--red);border:1px solid #f3c1c0}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{flex:none;padding:7px 16px;font-size:12px}
.hintpulse{animation:hp 1.2s infinite;outline:2px solid #ffd77e;outline-offset:2px}
@keyframes hp{50%{outline-color:transparent}}

/* 地图（拟真地图风格） */
#view-map{padding:0 0 20px}
.mapwrap{position:relative;background:#f2f3ea;overflow:hidden;box-shadow:0 1px 5px rgba(31,41,55,.08);height:clamp(320px,60vh,520px)}
.mapwrap svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.mloc{position:absolute;top:10px;left:10px;right:10px;z-index:3;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(31,41,55,.18);padding:9px 12px;font-size:12.5px;color:#3c4450;display:flex;align-items:center;gap:6px;pointer-events:none}
.mloc .mpin{font-size:14px}
.mloc b{font-weight:700;color:#1f2730}
.mloc-r{margin-left:auto;font-size:10.5px;color:#8a9199;white-space:nowrap}
.mzoom{position:absolute;top:58px;left:10px;z-index:3;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(31,41,55,.2);display:flex;flex-direction:column;overflow:hidden}
.mzoom button{width:34px;height:32px;font-size:16px;color:#3c4450;font-weight:700;line-height:1}
.mzoom button:first-child{border-bottom:1px solid #eef0f2}
.mlocate{position:absolute;right:10px;bottom:12px;z-index:3;width:38px;height:38px;background:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(31,41,55,.22);font-size:19px;color:#1a73e8;line-height:1}
.mlegend{position:absolute;left:10px;bottom:12px;z-index:3;background:rgba(255,255,255,.92);border-radius:9px;padding:5px 10px;font-size:9.5px;color:#5c6b62;display:flex;gap:9px;align-items:center;box-shadow:0 1px 4px rgba(31,41,55,.12)}
.mlegend i{display:inline-block;width:13px;height:3px;border-radius:2px;margin-right:3px;vertical-align:middle}
.cinfo{background:#fff;border-radius:14px;margin:10px 12px 0;padding:13px;box-shadow:0 1px 5px rgba(31,41,55,.06)}
.cinfo h3{font-size:15px;display:flex;align-items:center;gap:8px}
.cinfo .crow{display:flex;justify-content:space-between;font-size:12px;color:#555;margin-top:7px}

/* 行程中：地图上的行程进度卡 */
.jcard{background:#fff;border-radius:14px;margin:10px 12px 0;padding:12px 13px;box-shadow:0 1px 5px rgba(31,41,55,.06)}
.jhead{display:flex;align-items:center;gap:8px;font-size:13.5px}
.jhead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jstate{flex:none;font-size:10px;font-weight:700;color:#0a8f60;background:#e8f7f0;border-radius:6px;padding:2px 8px}
.jstate.paused{color:#b07a12;background:#fff3d6}
.jprog{position:relative;height:7px;background:#edf0f3;border-radius:4px;margin-top:11px}
.jprog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38d9a0,#0abf7e);border-radius:4px;transition:width .2s linear}
.jprog .jmarks{position:absolute;inset:0;pointer-events:none}
.jprog .jmarks i{position:absolute;top:-1px;height:9px;width:2px;margin-left:-1px;background:#c9d1d8;border-radius:1px}
.jprog .jmarks i.toll{background:#ffb02e}
.jprog .jmarks i.sa{background:#4aa3ff;width:4px;margin-left:-2px;border-radius:2px}
.jprog .jmarks i.br{background:#7a5fd0;width:4px;margin-left:-2px;border-radius:2px}
.jrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#66707a;margin-top:8px;line-height:1.5}
.jrow b{color:#222}
.jrow.warn{color:#e64340}
.jctlrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.jseg{flex:1;display:flex;background:#f1f4f6;border-radius:10px;overflow:hidden}
.jseg button{flex:1;padding:8px 0;font-size:11px;color:#667;color:var(--sub);font-weight:600}
.jseg button.on{background:var(--gr);color:#fff;border-radius:10px}
.jctl{flex:none;background:#f1f4f6;color:#3c4450;border-radius:10px;padding:8px 12px;font-size:11.5px;font-weight:700}
.jctl.resume{background:var(--gr);color:#fff}

/* 财务 */
.bigcard{background:linear-gradient(150deg,#123f31,#0c2c22);color:#fff;border-radius:16px;padding:16px;margin-bottom:10px}
.bigcard .bn{font-size:26px;font-weight:800;margin-top:3px}
.bigcard .bnrow{display:flex;gap:22px;margin-top:12px}
.bigcard .bnrow>div{flex:1}
.bigcard .bnrow .bn2{font-size:17px;font-weight:700;margin-top:2px}
.dprog{margin-top:13px}
.dprog .track{height:7px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.dprog .fill{height:100%;background:linear-gradient(90deg,#ffd77e,#ffb02e);border-radius:4px;transition:width .5s}
.dprog p{font-size:10px;opacity:.75;margin-top:5px}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}
.qbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:9px;padding:7px 0;font-size:11px;font-weight:600}
.ledger{background:#fff;border-radius:14px;padding:5px 13px;box-shadow:0 1px 5px rgba(31,41,55,.06)}
.ledrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f1f3f5;font-size:12px}
.ledrow:last-child{border:none}
.ledrow .lt b{font-size:12.5px;display:block}
.ledrow .lt span{font-size:10px;color:var(--sub)}
.ledrow .lv{font-weight:700}
.ledrow .lv.plus{color:var(--gr)}
.ledrow .lv.minus{color:var(--red)}

/* 娱乐 */
@keyframes funPop{0%{transform:scale(.4);opacity:0}62%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.funpop{animation:funPop .5s ease both}
.funtag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:5px;background:#f1e9ff;color:#7b2ff2;font-weight:700;margin-top:3px}

/* 车辆 */
.truckcard{background:linear-gradient(150deg,#17323f,#0e2129);color:#fff;border-radius:16px;padding:15px;margin-bottom:10px}
.truckcard h3{font-size:16px}
.truckcard .ts{font-size:11px;opacity:.7;margin-top:3px}
.tstat2{display:flex;gap:10px;margin-top:12px}
.tstat2>div{flex:1}
.tstat2 .track{height:5px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;margin-top:4px}
.tstat2 .fill{height:100%;background:#aef3d3;border-radius:4px}
.tstat2 .fill.warn{background:#ffd77e}
.tstat2 .fill.bad{background:#ff9f92}
.tstats-nums{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tsn{background:rgba(255,255,255,.1);border-radius:9px;padding:6px 10px;font-size:10px;opacity:.95}
.tsn b{display:block;font-size:13px;margin-top:1px}
.sect{background:#fff;border-radius:14px;padding:12px 13px;margin-bottom:10px;box-shadow:0 1px 5px rgba(31,41,55,.06)}
.sect h4{font-size:13px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.sect h4 .r{font-size:10px;color:var(--sub);font-weight:400}
.part{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f3f5}
.part:last-child{border:none}
.part .pi{width:36px;height:36px;background:#f2f6f4;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.part .pm{flex:1;min-width:0}
.part .pm b{font-size:13px;display:flex;gap:6px;align-items:center}
.part .pm b .pn{font-size:11px;color:var(--gr);font-weight:600}
.part .pm span{font-size:10.5px;color:var(--sub);display:block;margin-top:2px}
.upbtn{flex:none;background:var(--gr);color:#fff;font-size:11px;font-weight:700;padding:7px 12px;border-radius:16px;white-space:nowrap}
.upbtn.max{background:#e8ecef;color:#98a1a8}
.upbtn.lock{background:#e8ecef;color:#98a1a8}
.truckpick{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1f3f5}
.truckpick:last-child{border:none}
.truckpick .tp-i{font-size:26px}
.truckpick .tp-m{flex:1}
.truckpick .tp-m b{font-size:13.5px}
.truckpick .tp-m p{font-size:10.5px;color:var(--sub);margin-top:2px}
.truckpick .cur{font-size:10px;color:var(--gr);font-weight:700}

/* 更多 */
.mlist{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(31,41,55,.06);overflow:hidden}
.mrow{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid #f1f3f5;font-size:13px}
.mrow:last-child{border:none}
.mrow .mi{font-size:17px}
.mrow .mv{margin-left:auto;color:var(--sub);font-size:11px}
.switch{width:40px;height:22px;border-radius:12px;background:#d9dee2;position:relative;transition:background .2s;flex:none}
.switch.on{background:var(--gr)}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s}
.switch.on i{left:20px}
.achv{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1f3f5;align-items:center}
.achv:last-child{border:none}
.achv .ai{width:38px;height:38px;border-radius:50%;background:#f1f4f6;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.achv.done .ai{background:linear-gradient(150deg,#ffe9c2,#ffd07a)}
.achv b{font-size:12.5px;display:block}
.achv span{font-size:10.5px;color:var(--sub)}
.achv:not(.done){opacity:.55}

/* 底部导航 */
#navbar{flex:none;display:flex;background:#fff;border-top:1px solid #eceff2;padding-bottom:env(safe-area-inset-bottom)}
.nitem{flex:1;text-align:center;padding:7px 0 8px;position:relative;color:#9aa3ab}
.nitem .ni{font-size:20px;line-height:1.1;display:block}
.nitem .nt{font-size:10.5px;font-weight:600;margin-top:2px;display:block}
.nitem.on{color:var(--gr)}
.nitem .badge{position:absolute;top:4px;right:calc(50% - 22px);width:8px;height:8px;background:var(--red);border-radius:50%;border:1.5px solid #fff}

/* 弹窗 */
#modals{position:absolute;inset:0;z-index:200;pointer-events:none} /* 高于 #title(90)/#end(95)：标题页的槽位选择等弹窗不能被压在下面 */
.mwrap{position:absolute;inset:0;background:rgba(10,16,14,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .22s;pointer-events:auto}
.mwrap.center{align-items:center;padding:24px}
.mwrap.on{opacity:1}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:17px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:82%;overflow-y:auto;transform:translateY(30px);transition:transform .22s}
.mwrap.on .sheet{transform:none}
.mwrap.center .sheet{border-radius:18px;max-width:360px;width:100%;transform:scale(.94)}
.mwrap.center.on .sheet{transform:none}
.sheet h3{font-size:16px;margin-bottom:4px}
.sheet .mtag{display:inline-block;font-size:10px;background:#e8f7f0;color:var(--gr);border-radius:6px;padding:2px 7px;font-weight:700;margin-bottom:6px}
.sheet .mbody{font-size:12.5px;color:#555;line-height:1.65}
.mbtns{display:flex;gap:9px;margin-top:15px}
.setl{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed #edf0f2}
.setl.total{border:none;font-weight:800;font-size:14px;padding-top:10px}
.setl .plus{color:var(--gr);font-weight:700}
.setl .minus{color:var(--red);font-weight:700}
.seg{display:flex;background:#f1f4f6;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:11.5px;font-weight:600;color:#7a8288}
.seg button.on{background:#fff;color:var(--gr);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.routeopt{border:1.5px solid #e8ecf0;border-radius:13px;padding:12px;margin-bottom:9px;transition:border-color .15s}
.routeopt.on{border-color:var(--gr);background:#f4fbf8}
.routeopt .rh{display:flex;align-items:center;gap:7px}
.routeopt .rh b{font-size:14px}
.routeopt .rh .rt{font-size:9px;background:var(--gr);color:#fff;border-radius:5px;padding:1.5px 6px;font-weight:700}
.routeopt .rh .price{margin-left:auto;font-size:0}
.routeopt .rg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:9px;font-size:10.5px;color:#666}
.routeopt .rg b{display:block;font-size:12px;color:#222}
.routeopt .deadline{margin-top:8px;font-size:11px}
.routeopt .deadline.ok{color:var(--gr)}
.routeopt .deadline.bad{color:var(--red)}

/* 提示 */
#toasts{position:absolute;top:calc(env(safe-area-inset-top) + 64px);left:0;right:0;z-index:210;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.toast{background:rgba(20,26,24,.92);color:#fff;font-size:12px;padding:9px 16px;border-radius:20px;max-width:86%;text-align:center;animation:tin .25s;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.money{color:#ffe9b8}
